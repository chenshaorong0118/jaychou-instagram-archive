name: Verify public index

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify index and fixed-commit timelines
        run: |
          python3 tools/verify_index.py .
          python3 tools/generate_timeline.py . --check
