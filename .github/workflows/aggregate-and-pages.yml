name: Aggregate batches and deploy Pages

on:
  repository_dispatch:
    types:
      - archive-batch-submitted
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "index/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: archive-aggregate-and-pages
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    outputs:
      page_artifact: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install index dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Aggregate all pending batch refs
        env:
          ARCHIVE_MEDIA_PAT: ${{ secrets.ARCHIVE_MEDIA_PAT }}
        run: python tools/aggregate_batches.py --index-root .

      - name: Verify generated index
        run: python tools/verify_index.py .

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Build static gallery
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: aggregate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        # deploy-pages v5 still bundles a dependency that loads node:punycode.
        # Remove this narrow suppression after actions/deploy-pages#413 is fixed.
        env:
          NODE_OPTIONS: --disable-warning=DEP0040
        uses: actions/deploy-pages@v5
